<title>Fynix Sales Sales</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: dark top menu bar (tabs + search + user), white flat content; paginated lead table; modal for details; list + detail on Assigned. */
:root{
  --bg:#ffffff; --hover:#f6f7f9; --sel:#f0f2f5; --line:#e8eaee; --line2:#d6dae1;
  --fg:#111318; --muted:#6a7280; --faint:#9aa1ad; --ink:#111318; --ink-fg:#ffffff; --accent:#3b5bdb;
  --d-new:#a3a9b5; --d-contacted:#3b82f6; --d-interested:#e0a100; --d-meeting:#8b5cf6; --d-negotiation:#ea7a1a; --d-won:#16a34a; --d-lost:#dc2626;
  --star:#e0a100;
  --nav:#0f1b2d; --nav-fg:#ffffff; --nav-muted:#9fb0c6; --nav-hover:#1a2a42; --nav-sel:#25395a;
  --f:'Inter',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
/* slim light scrollbars (dropdown lists, wide tables) */
*{scrollbar-width:thin;scrollbar-color:#c9ced6 transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c9ced6;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#aab1bc;background-clip:content-box}
body{background:var(--bg);color:var(--fg);font:13.5px/1.5 var(--f);margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
a{color:var(--accent);text-decoration:none;overflow-wrap:anywhere}
a:hover{text-decoration:underline}
.ti{display:none}
.tabs .tab-profile{display:none}
.pill{display:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.muted{color:var(--muted)}

/* menu bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--nav)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);color:var(--nav-fg)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:8px;height:56px}
@media (min-width:821px){
  /* three zones: logo + workspace on the left, the menu in the middle, search + account on the right */
  .top .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);max-width:none;padding-left:28px;padding-right:28px;gap:24px}
  .zl{display:flex;align-items:center;gap:10px;min-width:0}
  .zr{display:flex;align-items:center;justify-content:flex-end;gap:14px;min-width:0}
  .zr .gsearch{flex:0 1 240px;margin-left:0}
  .zr .who{margin-left:0}
  .brand{margin-right:4px}
}
@media (min-width:821px) and (max-width:1180px){
  .zr .gsearch{flex-basis:170px}
  .who-btn>span{display:none}
  .top .wrap{gap:16px;padding-left:20px;padding-right:20px}
}
@media (min-width:821px) and (max-width:980px){
  .brand-t{display:none}
  .zr .gsearch{flex-basis:140px}
}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em;font-size:15px;margin-right:18px;color:#fff}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:block;position:relative}
.brand i::after{content:"";position:absolute;left:6px;top:5px;width:4px;height:12px;background:#fff;border-radius:1px;box-shadow:6px 4px 0 0 #fff}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;padding:0 14px;cursor:pointer;color:var(--nav-muted);height:36px;border-radius:7px;display:flex;align-items:center;gap:8px;font-weight:500}
.tab:hover{color:#fff;background:var(--nav-hover)}
.tab[aria-selected="true"]{color:#fff;background:var(--nav-sel)}
.tab .c{font:500 11px var(--mono);background:rgba(255,255,255,.14);color:#fff;border-radius:5px;padding:1px 6px}
.tab[aria-selected="true"] .c{background:var(--accent)}
.gsearch{margin-left:auto;position:relative;flex:0 1 280px;min-width:0}
.gsearch svg{pointer-events:none;z-index:4;position:absolute;left:14px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--nav-muted)}
.gsearch input{width:100%;height:34px;border:1px solid transparent;background:var(--nav-hover);color:#fff;border-radius:17px;padding:0 14px 0 36px;position:relative;z-index:0}
.gsearch input::placeholder{color:var(--nav-muted)}
.gsearch input:focus{outline:none;background:var(--nav-sel)}
.ws-btn{display:flex;align-items:center;gap:8px;height:34px;padding:0 11px;border:0;border-radius:9px;background:var(--nav-hover);color:#fff;cursor:pointer;font-weight:500}
.ws-btn:hover{background:var(--nav-sel)}
.tile-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:linear-gradient(180deg,var(--t1),var(--t2));
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.38),0 1px 2px rgba(0,0,0,.18)}
.tile-ic svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ws-btn .tile-ic{width:22px;height:22px;border-radius:6px}
.ws-btn .tile-ic svg{width:14px;height:14px}
.opt .tile-ic+.ol{margin-right:auto}
.opt{justify-content:flex-start}
.opt .ck{margin-left:auto}
.ws-btn .chev{stroke:var(--nav-muted);margin:0}
.ws-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.ws-btn b{font-weight:600}
.ws-btn,.who-btn,.tab{white-space:nowrap}

.top .combo{margin-right:6px}
#nt-dd{margin-right:0}
.nt-btn{position:relative;width:24px;height:24px;border:0;border-radius:6px;background:linear-gradient(180deg,#ff6b63,#e5342d);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25),0 1px 2px rgba(0,0,0,.3);cursor:pointer;display:grid;place-items:center;padding:0}
.nt-btn:hover{filter:brightness(1.07)}
.bell{width:13px;height:13px;fill:#fff;stroke:#fff;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;transform-origin:50% 14%}
.nt-badge{position:absolute;top:-6px;right:-7px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:#fff;color:#d92d27;font-size:9.5px;font-weight:700;line-height:15px;text-align:center;box-sizing:border-box;font-variant-numeric:tabular-nums;box-shadow:0 0 0 1.5px var(--nav)}
@keyframes badge-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@keyframes bell-ring{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(15deg)}92%{transform:rotate(-13deg)}95%{transform:rotate(9deg)}98%{transform:rotate(-4deg)}}
.nt-btn.has .nt-badge{animation:badge-pulse 1.8s ease-in-out infinite}
.nt-btn.has .bell{animation:bell-ring 5s ease-in-out infinite}
.nt-btn[aria-expanded="true"] .nt-badge,.nt-btn[aria-expanded="true"] .bell{animation:none}
@media (prefers-reduced-motion:reduce){.nt-btn.has .nt-badge,.nt-btn.has .bell{animation:none}}
#nt-dd .nt-pop{position:fixed;top:54px;right:16px;left:auto;width:340px;max-width:calc(100vw - 32px);padding:0;overflow:hidden;transform:none}
.nt-h{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.nt-h b{font-weight:600;font-size:14px;color:var(--fg)}
.nt-all{background:none;border:0;padding:0;color:var(--muted);font-size:12.5px;cursor:pointer}
.nt-all:hover{color:var(--fg)}
.nrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 16px;cursor:pointer;color:var(--fg)}
.nt-h+.opts .nrow:first-child{border-top:0}
.nrow:hover{background:var(--hover)}
.nrow .ol{display:flex;flex-direction:column;min-width:0;flex:1}
.nt-t{font-weight:500;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow.unread .nt-t{font-weight:600}
.nrow .sm{color:var(--muted);font-size:12px}
.nrow:not(.unread) .nt-t{color:var(--muted);font-weight:400}
.nrow:not(.unread) .tile-ic{opacity:.5}
.nt-tag{font-size:12px;font-family:var(--mono);color:var(--muted);flex:none}
.nt-od{color:var(--d-lost)}
.nt-td{color:var(--fg)}
.nrow:not(.unread) .nt-tag{color:var(--faint)}
.nt-empty{margin:0;padding:34px 16px 36px;text-align:center;color:var(--muted);font-size:13px}
.nt-empty b{display:block;color:var(--fg);font-weight:600;font-size:14px;margin-bottom:2px}
.who{display:flex;align-items:center;gap:8px;margin-left:10px;padding-left:14px;border-left:1px solid var(--nav-sel)}
.av{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--ink-fg);display:grid;place-items:center;font-size:10.5px;font-weight:600;flex:none}
.who .av{background:var(--accent);color:#fff}

/* border beam on the search box: the "line" variant of the Border Beam library (libraries.dev/beam), same layers and timings, in blue and white */
@property --bx{syntax:'<number>';inherits:true;initial-value:0}
@property --bw{syntax:'<number>';inherits:true;initial-value:1}
@property --bh{syntax:'<number>';inherits:true;initial-value:1}
@property --bs{syntax:'<number>';inherits:true;initial-value:1}
@property --bs2{syntax:'<number>';inherits:true;initial-value:1}
@property --be{syntax:'<number>';inherits:true;initial-value:1}
@property --bo{syntax:'<number>';inherits:true;initial-value:0}
@property --pad{syntax:'<length>';inherits:true;initial-value:5px}
@property --ba{syntax:'<angle>';inherits:true;initial-value:0deg}
@keyframes beam-spin-icon{to{--ba:360deg}}
.gsearch{--beam-strength:1;border-radius:17px;overflow:hidden;
  animation:beam-travel 3.1s linear infinite,beam-edge 3.1s linear infinite,beam-breathe 4s ease-in-out infinite,beam-spike 4.1s ease-in-out infinite,beam-spike2 5.3s ease-in-out infinite,beam-in .6s ease forwards}
.gsearch::before,.gsearch::after,.gsearch .bloom{content:"";position:absolute;inset:0;pointer-events:none}
.gsearch::after{border-radius:16px;padding:1px;clip-path:inset(0 round 17px);z-index:2;
  background:
    radial-gradient(ellipse calc(24px*var(--bw)) calc(28px*var(--bh)) at calc(var(--bx)*100%) calc(100% + 2px),rgba(255,255,255,.38) 0%,rgba(255,255,255,.12) 30%,transparent 65%),
    radial-gradient(ellipse calc(36px*var(--bw)) calc(36px*var(--bh)) at calc(var(--bx)*100%) calc(100% + 2px),rgb(255,255,255),transparent),
    radial-gradient(ellipse calc(30px*var(--bw)) calc(32px*var(--bh)) at calc(var(--bx)*100% + 39px) 100%,rgb(130,195,255),transparent),
    radial-gradient(ellipse calc(33px*var(--bw)) calc(28px*var(--bh)) at calc(var(--bx)*100% - 36px) calc(100% + 2px),rgb(70,135,255),transparent),
    radial-gradient(ellipse calc(29px*var(--bw)) calc(34px*var(--bh)) at calc(var(--bx)*100% - 54px) 100%,rgb(30,90,235),transparent),
    radial-gradient(ellipse calc(27px*var(--bw)) calc(30px*var(--bh)) at calc(var(--bx)*100% + 51px) calc(100% - 1px),rgb(170,215,255),transparent),
    radial-gradient(ellipse calc(36px*var(--bw)) calc(24px*var(--bh)) at calc(var(--bx)*100% + 21px) calc(100% + 1px),rgb(70,110,255),transparent),
    radial-gradient(ellipse calc(30px*var(--bw)) calc(22px*var(--bh)) at calc(var(--bx)*100% - 21px) 100%,rgb(40,110,255),transparent),
    radial-gradient(ellipse calc(25px*var(--bw)) calc(28px*var(--bh)) at calc(var(--bx)*100% + 66px) calc(100% + 1px),rgb(205,228,255),transparent),
    radial-gradient(ellipse calc(23px*var(--bw)) calc(30px*var(--bh)) at calc(var(--bx)*100% - 66px) calc(100% - 1px),rgb(95,165,255),transparent);
  mask-image:radial-gradient(ellipse calc(78px*var(--bw)) calc(60px*var(--bh)) at calc(var(--bx)*100%) 100%,#fff 0%,rgba(255,255,255,.5) 45%,transparent 100%),linear-gradient(#fff 0 0),linear-gradient(#fff 0 0);
  mask-clip:border-box,content-box,border-box;mask-origin:border-box,content-box,border-box;mask-composite:intersect,exclude,intersect;
  opacity:calc(var(--bo)*var(--be)*1.14*var(--beam-strength));animation:beam-hue 12s ease-in-out infinite}
.gsearch::before{border-radius:17px;clip-path:inset(0 round 17px);z-index:1;
  background:
    radial-gradient(ellipse calc(33px*var(--bw)) calc(30px*var(--bh)) at calc(var(--bx)*100%) 100%,rgba(255,255,255,.48),transparent),
    radial-gradient(ellipse calc(24px*var(--bw)) calc(26px*var(--bh)) at calc(var(--bx)*100% + 39px) calc(100% - 3px),rgba(130,195,255,.42),transparent),
    radial-gradient(ellipse calc(27px*var(--bw)) calc(24px*var(--bh)) at calc(var(--bx)*100% - 36px) 100%,rgba(70,135,255,.48),transparent),
    radial-gradient(ellipse calc(23px*var(--bw)) calc(28px*var(--bh)) at calc(var(--bx)*100% - 54px) calc(100% - 2px),rgba(30,90,235,.42),transparent),
    radial-gradient(ellipse calc(24px*var(--bw)) calc(24px*var(--bh)) at calc(var(--bx)*100% + 51px) calc(100% - 1px),rgba(170,215,255,.5),transparent),
    radial-gradient(ellipse calc(30px*var(--bw)) calc(20px*var(--bh)) at calc(var(--bx)*100% + 21px) 100%,rgba(70,110,255,.45),transparent),
    radial-gradient(ellipse calc(25px*var(--bw)) calc(18px*var(--bh)) at calc(var(--bx)*100% - 21px) calc(100% - 2px),rgba(40,110,255,.4),transparent),
    radial-gradient(ellipse calc(21px*var(--bw)) calc(24px*var(--bh)) at calc(var(--bx)*100% + 66px) 100%,rgba(205,228,255,.45),transparent),
    radial-gradient(ellipse calc(18px*var(--bw)) calc(26px*var(--bh)) at calc(var(--bx)*100% - 66px) calc(100% - 1px),rgba(95,165,255,.52),transparent);
  box-shadow:inset 0 0 9px 1px rgba(255,255,255,.1);
  mask-image:radial-gradient(ellipse calc(78px*var(--bw)) calc(60px*var(--bh)) at calc(var(--bx)*100%) 100%,#fff 0%,rgba(255,255,255,.5) 45%,transparent 100%),linear-gradient(#fff,transparent 28px,transparent calc(100% - 28px),#fff),linear-gradient(to right,#fff,transparent 28px,transparent calc(100% - 28px),#fff);
  mask-composite:intersect,add;
  opacity:calc(var(--bo)*var(--be)*.7*var(--beam-strength));animation:beam-hue 12s ease-in-out infinite}
.gsearch .bloom{border-radius:16px;clip-path:inset(0 round 17px);z-index:3;
  background:
    radial-gradient(ellipse calc(.8px*var(--bs)) calc(92px*var(--bh)) at 8% calc(100% - 2px),rgb(255,255,255),rgb(255,255,255) 30%,transparent 88%),
    radial-gradient(ellipse calc(10px*var(--bs2)) calc(35px*var(--bh)) at 22% calc(100% - 4px),rgba(85,160,255,.98),rgba(85,160,255,.49) 50%,transparent 95%),
    radial-gradient(ellipse calc(2px*(2 - var(--bs))) calc(72px*var(--bh)) at 36% calc(100% - 3px),rgb(70,110,255),rgb(70,110,255) 40%,transparent 90%),
    radial-gradient(ellipse calc(14px*var(--bs2)) calc(28px*var(--bh)) at 50% calc(100% - 2px),rgba(195,222,255,.59),rgba(195,222,255,.29) 55%,transparent 96%),
    radial-gradient(ellipse calc(1.2px*(2 - var(--bs2))) calc(85px*var(--bh)) at 64% calc(100% - 4px),rgb(125,182,255),rgb(125,182,255) 35%,transparent 89%),
    radial-gradient(ellipse calc(7px*var(--bs)) calc(45px*var(--bh)) at 78% calc(100% - 2px),rgba(40,95,230,.91),rgba(40,95,230,.45) 48%,transparent 94%),
    radial-gradient(ellipse calc(.6px*(2 - var(--bs))) calc(60px*var(--bh)) at 92% calc(100% - 3px),rgb(40,110,255),rgb(40,110,255) 42%,transparent 91%),
    radial-gradient(ellipse calc(21px*var(--bs)) calc(15px*var(--bs2)) at calc(var(--bx)*100%) calc(100% + 1px),#fff 0%,rgba(255,255,255,.9) 20%,rgba(255,255,255,.5) 50%,transparent 100%),
    radial-gradient(ellipse calc(42px*var(--bw)) calc(40px*var(--bh)) at calc(var(--bx)*100%) 100%,rgba(255,255,255,.3) 0%,rgba(255,255,255,.12) 25%,rgba(255,255,255,.03) 55%,transparent 80%);
  mask-image:radial-gradient(ellipse calc(84px*var(--bw)) calc(110px*var(--bh)) at calc(var(--bx)*100%) 100%,#fff 0%,rgba(255,255,255,.5) 35%,transparent 100%);
  opacity:calc(var(--bo)*var(--be)*.8*var(--beam-strength));animation:beam-hue-bloom 8s ease-in-out infinite}
@keyframes beam-travel{0%{--bx:.06;--bw:.5}10%{--bx:.15;--bw:.8}20%{--bx:.25;--bw:1.1}30%{--bx:.35;--bw:1.3}40%{--bx:.44;--bw:1.45}50%{--bx:.5;--bw:1.5}60%{--bx:.56;--bw:1.45}70%{--bx:.65;--bw:1.3}80%{--bx:.75;--bw:1.1}90%{--bx:.85;--bw:.8}100%{--bx:.94;--bw:.5}}
@keyframes beam-edge{0%{--be:0}12.5%{--be:0}32.5%{--be:1}67.5%{--be:1}87.5%{--be:0}100%{--be:0}}
@keyframes beam-breathe{0%,100%{--bh:.8}25%{--bh:1.25}55%{--bh:.85}80%{--bh:1.3}}
@keyframes beam-spike{0%{--bs:.8}25%{--bs:1.3}50%{--bs:.9}75%{--bs:1.4}100%{--bs:.8}}
@keyframes beam-spike2{0%{--bs2:1.2}25%{--bs2:.7}50%{--bs2:1.4}75%{--bs2:.8}100%{--bs2:1.2}}
@keyframes beam-in{100%{--bo:1}}
@keyframes beam-hue{0%,100%{filter:brightness(1.3) saturate(1.2)}50%{filter:brightness(1.3) saturate(1.2)}}
@keyframes beam-hue-bloom{0%,100%{filter:blur(8px) brightness(1.3) saturate(1.2)}50%{filter:blur(8px) brightness(1.3) saturate(1.2)}}
@media (prefers-reduced-motion:reduce){.gsearch,.gsearch::after,.gsearch::before,.gsearch .bloom{animation:none}.gsearch{--bo:1;--bx:.5;--bw:1.2}}
.gclose{display:none;position:absolute;right:5px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;border-radius:50%;background:none;cursor:pointer;z-index:5;place-items:center;padding:0}
.gclose svg{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;pointer-events:none}
.gclose:hover svg{stroke:var(--nav-muted)}
.top.kpi .gsearch{display:none}
.top.kpi .who{margin-left:0}
.top.kpi #nt-dd{margin-left:auto}

/* KPIs */
.prof{display:flex;align-items:center;gap:14px;padding:6px 0 18px}
.pav{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:600;flex:none}
.pblk{border-top:1px solid var(--line);padding:16px 0 4px}
.pblk h3{font-size:12px;font-weight:500;color:var(--muted);margin:0 0 10px}
.prow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer;color:var(--fg)}
.pblk h3+.prow{border-top:0}
.prow.static{cursor:default}
.prow .ol{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.prow .ck{width:12px;height:10px;flex:none;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.prow[aria-pressed="false"] .ck{visibility:hidden}
.prow .av{width:34px;height:34px;font-size:12px}
.kc-black{--k:#111318;--dot:#111318}
.kc-green{--k:#16a34a;--dot:#16a34a}
.kc-red{--k:#dc2626;--dot:#dc2626}
.kseg{display:inline-flex;margin-left:auto;border:1px solid var(--line2);border-radius:8px;overflow:hidden;align-self:center}
.kseg button{background:none;border:0;border-right:1px solid var(--line2);padding:0 13px;height:30px;cursor:pointer;color:var(--muted);font-size:13px;white-space:nowrap}
.kseg button:last-child{border-right:0}
.kseg button:hover{background:var(--hover);color:var(--fg)}
.kseg button.on{background:var(--ink);color:#fff;font-weight:500}
.l-short{display:none}
.kcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:4px}
.kcard{border-top:3px solid var(--k);padding-top:12px;min-width:0}
.kc-l{font-weight:500}
.kc-n{font-size:30px;font-weight:500;line-height:1.1;letter-spacing:-.02em;margin:6px 0 2px}
.kc-n small{font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0}
.ktrack{position:relative;height:6px;border-radius:3px;background:var(--sel);margin:10px 0 6px}
.ktrack i{display:block;height:100%;border-radius:3px;background:var(--k)}
.ktrack b{position:absolute;top:-3px;width:2px;height:12px;background:var(--muted);border-radius:1px}
.kpnote{margin:10px 0 16px}
.katt{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-left:3px solid var(--d-lost);padding:10px 14px;background:var(--hover);border-radius:0 8px 8px 0;margin:0 0 6px}

        if(g[0]==='closed') return y.last-x.last;

      if(items.length) out.push({key:g[0],title:g[1],items:items});

    var openL=m.filter(function(l){var s=W(l).status;return s!=='Won'&&s!=='Lost';});
    var overdue=openL.filter(function(l){return groupOf(l)==='od';}).length;
    var nodate=openL.filter(function(l){return groupOf(l)==='none';}).length;
    var max=Math.max.apply(null,Object.keys(by).map(function(s){return by[s];}).concat([1]));
    var acts=[];
    m.forEach(function(l){
      var mineC=W(l).comments.filter(function(c){return c.by===state.user;});
      if(mineC.length) acts.push({lead:l,c:mineC[mineC.length-1]});
    });
    acts=acts.slice(0,5);
    var seg='<div class="kseg" role="group" aria-label="Period">'+KP_PERIODS.map(function(x){return '<button type="button" data-kp="'+x[0]+'"'+(p===x[0]?' class="on" aria-pressed="true"':' aria-pressed="false"')+'><span class="l-long">'+x[1]+'</span><span class="l-short">'+x[2]+'</span></button>';}).join('')+'</div>';
    var h='<div class="head khead"><h1>KPIs</h1><span class="sub">'+esc(svcName())+'<span class="l-long"> · '+esc(user(state.user).name)+'</span></span>'+seg+'</div>';
    if(!m.length){
      view.innerHTML=h+'<div class="tablewrap"><div class="empty"><b>No leads assigned yet</b>Your numbers appear here once you assign leads in Information.</div></div>';
      return;
    }
    var att;
    if(overdue||nodate){
      var bits=[];
      if(overdue) bits.push(overdue+(overdue===1?' follow-up overdue':' follow-ups overdue'));
      if(nodate) bits.push(nodate+(nodate===1?' lead has no follow-up date':' leads have no follow-up date'));
      att='<div class="katt"><div><b>Needs attention</b><span class="sm"> · '+bits.join(' · ')+'</span></div><button type="button" class="klink" data-kgo="'+(overdue?'od':'later')+'">View in Assigned →</button></div>';
    } else att='<div class="katt calm"><span class="sm">Nothing overdue, and every open lead has a follow-up date.</span></div>';
    h+='<div class="kcards">'+
      kpiCard('Leads contacted','Moved out of New',contacted,TARGETS.contacted,'black',month)+
      kpiCard('Meetings fixed','Reached the Meeting stage',meetings,TARGETS.meetings,'black',month)+
      kpiCard('Deals won','Marked Won',won,TARGETS.won,'green',month)+'</div>'+
      (month?'<p class="sm kpnote">Demo targets. The tick shows where you should be today: '+Math.round(monthElapsed()*100)+'% of the month has passed.</p>':'<p class="sm kpnote">Counts for '+(p==='today'?'today':'the last 7 days')+'. Targets are monthly, so they show on This month.</p>')+
      att+
      '<div class="kcols"><section class="ksec"><h3>Pipeline now</h3>'+
        STAGES.concat(['Lost']).map(function(s){
          return '<div class="frow kc-'+kindOf(s)+'"><span class="st">'+s+'</span><span class="ftrack"><i style="width:'+Math.round(by[s]/max*100)+'%"></i></span><span class="num">'+by[s]+'</span></div>';
        }).join('')+'</section>'+
      '<section class="ksec"><h3>Latest updates</h3>'+(acts.length?acts.map(function(a){
        return '<div class="act"><div class="c-meta"><b>'+esc(a.lead.name)+'</b><span>'+esc(a.c.at)+'</span><span class="st kc-'+kindOf(a.c.stage)+'">'+esc(a.c.stage)+'</span></div><p class="c-body">'+esc(a.c.text)+'</p></div>';
      }).join(''):'<p class="muted">No notes yet. Notes you add on assigned stores show up here.</p>')+'</section></div>';
    view.innerHTML=h;
  }

  /* ---------- wiring ---------- */
  function render(){chrome();({info:renderInfo,assigned:renderAssigned,kpi:renderKpi,profile:renderProfile})[state.tab]();}

  document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){
    if(state.tab===b.dataset.tab) return;
    state.tab=b.dataset.tab;state.open='';state.showDetail=false;
    settleBar();window.scrollTo(0,0);render();animateView('tab');
  });});

  var gq=document.getElementById('gq');
  var topBar=document.querySelector('.top');
  gq.addEventListener('focus',function(){topBar.classList.add('search-open');});
  gq.addEventListener('blur',function(){setTimeout(function(){if(!gq.value.trim()&&document.activeElement!==gq) topBar.classList.remove('search-open');},120);});
  document.getElementById('gclose').addEventListener('click',function(e){
    e.preventDefault();
    gq.value='';state.q='';state.page=0;gq.blur();topBar.classList.remove('search-open');render();
  });
  gq.addEventListener('input',function(){state.q=gq.value;state.page=0;render();});


  document.addEventListener('click',function(){setTimeout(function(){if(state.open!=='nt') renderNt();},0);});
  document.addEventListener('click',function(e){
    var ntb=e.target.closest('[data-ntbtn]'); if(ntb){setOpen(state.open==='nt'?'':'nt');return;}
    var nta=e.target.closest('[data-ntall]'); if(nta){notifications().forEach(function(n){state.read[n.id]=true;});renderNt(true);return;}
    var nto=e.target.closest('[data-ntopt]'); if(nto){openNotification(nto.dataset.ntopt);return;}
    var wsb=e.target.closest('[data-wsbtn]');
    if(wsb){setOpen(state.open==='ws'?'':'ws');return;}
    var wso=e.target.closest('[data-wsopt]');
    if(wso){switchService(wso.dataset.wsopt);return;}
    var wb=e.target.closest('[data-whobtn]');
    if(wb){setOpen(state.open==='who'?'':'who');return;}
    var wu=e.target.closest('[data-whouser]');
    if(wu){
      state.user=wu.dataset.whouser;state.selected=null;state.showDetail=false;state.q=state.area=state.cat=state.grp=state.minr='';state.sort='rev';state.page=0;state.open='';gq.value='';
      closeModal();render();toast('Viewing as '+user(state.user).name);return;
    }
    if(state.open&&!e.target.closest('.combo')) setOpen('');
    var c=e.target.closest('[data-copy]');
    if(c){
      var done=function(){toast('Copied');};
      try{navigator.clipboard.writeText(c.dataset.copy).then(done,function(){toast('Copy not available here');});}
      catch(err){toast('Copy not available here');}
    }
  });

  view.addEventListener('click',function(e){
    var ob=e.target.closest('[data-ddopt]');
    if(ob){ddSet(ob.dataset.ddopt,ob.dataset.v);state.open='';renderInfo();return;}
    var db=e.target.closest('[data-ddbtn]');
    if(db){setOpen(state.open===db.dataset.ddbtn?'':db.dataset.ddbtn);return;}
    var a=e.target.closest('[data-assign]'); if(a){openModal(a.dataset.assign);return;}
    var gt=e.target.closest('[data-goto]'); if(gt){state.page=parseInt(gt.dataset.goto,10);renderInfo();window.scrollTo(0,0);return;}
    var pg=e.target.closest('[data-page]'); if(pg){state.page+=parseInt(pg.dataset.page,10);renderInfo();window.scrollTo(0,0);return;}
    var bk=e.target.closest('[data-back]'); if(bk){state.showDetail=false;settleBar();window.scrollTo(0,0);renderAssigned();animateView('pop');return;}
    var p=e.target.closest('[data-pick]'); if(p){state.selected=p.dataset.pick;state.showDetail=true;settleBar();window.scrollTo(0,0);renderAssigned();animateView('push');return;}
    var inf=e.target.closest('[data-info]'); if(inf){openInfo(inf.dataset.info);return;}
    var kp=e.target.closest('[data-kp]'); if(kp){state.kpiPeriod=kp.dataset.kp;renderKpi();return;}
    var kg=e.target.closest('[data-kgo]'); if(kg){state.tab='assigned';state.qf='';state.showDetail=false;state.open='';settleBar();window.scrollTo(0,0);render();animateView('tab');return;}
    var sfb=e.target.closest('[data-sfbtn]'); if(sfb){setOpen(state.open==='sf'?'':'sf');return;}
    var sfo=e.target.closest('[data-sfopt]'); if(sfo){state.stageFilter=sfo.dataset.sfopt;state.open='';renderAssigned();return;}
    var qf=e.target.closest('[data-qf]'); if(qf){state.qf=state.qf===qf.dataset.qf?'':qf.dataset.qf;renderAssigned();return;}
    var ct=e.target.closest('[data-closedtoggle]'); if(ct){state.closedOpen=!state.closedOpen;renderAssigned();return;}
    var sb=e.target.closest('[data-stagebtn]'); if(sb){setOpen(state.open==='stage'?'':'stage');return;}
    var so=e.target.closest('[data-stageopt]');
    if(so){
      var l=byId(state.selected), w=l&&W(l), ns=so.dataset.stageopt; state.open='';
      if(!w||w.owner!==state.user||w.status===ns){renderAssigned();return;}
      w.status=ns; w.last=Date.now(); w.history.push({s:ns,t:Date.now()}); state.logStage=ns; state.stgOpen={};
      if(ns==='Won'||ns==='Lost') w.next='';
      w.comments.push({by:'sys',at:nowStr(),text:'Stage changed to '+ns+'.',stage:ns});
      renderAssigned(); chrome(); return;
    }
    var fb=e.target.closest('[data-fubtn]');
    if(fb){var lo=byId(state.selected), wo=lo&&W(lo); state.calMonth=((wo&&wo.next)||dayOffset(0)).slice(0,7); setOpen(state.open==='fu'?'':'fu'); return;}
    var cn=e.target.closest('[data-calnav]');
    if(cn){
      var cy=parseInt(state.calMonth.slice(0,4),10), cm=parseInt(state.calMonth.slice(5,7),10)-1+parseInt(cn.dataset.calnav,10), dd=new Date(cy,cm,1);
      state.calMonth=dd.getFullYear()+'-'+pad2(dd.getMonth()+1); renderAssigned(); return;
    }
    var cd=e.target.closest('[data-day]');
    if(cd){
      var lc=byId(state.selected), wc=lc&&W(lc); state.open='';
      if(!wc||wc.owner!==state.user){renderAssigned();return;}
      wc.next=cd.dataset.day; renderAssigned(); toast('Follow-up set for '+fuText(wc.next)); return;
    }
    var fq=e.target.closest('[data-fu]');
    if(fq){
      var lf=byId(state.selected), wf=lf&&W(lf); if(!wf||wf.owner!==state.user) return;
      wf.next=fq.dataset.fu==='clear'?'':dayOffset(parseInt(fq.dataset.fu,10));
      renderAssigned(); toast(wf.next?'Follow-up set for '+fuText(wf.next):'Follow-up cleared'); return;
    }
    var tg=e.target.closest('[data-stgtoggle]');
    if(tg){
      var ls=byId(state.selected), ws=ls&&W(ls), sn=tg.dataset.stgtoggle;
      var cur=state.stgOpen.hasOwnProperty(sn)?state.stgOpen[sn]:(ws&&sn===ws.status);
      state.stgOpen[sn]=!cur; renderAssigned(); return;
    }
    var an=e.target.closest('[data-addnote]');
    if(an){state.logStage=an.dataset.addnote;state.stgOpen[an.dataset.addnote]=true;renderAssigned();var nt=document.getElementById('note');if(nt)nt.focus();return;}
    if(e.target.id==='post'){
      var ta=document.getElementById('note'), txt=ta.value.trim();
      if(!txt){ta.focus();toast('Write a note first, or skip it. Notes are optional.');return;}
      var cur=byId(state.selected), cw=W(cur);
      cw.comments.push({by:state.user,at:nowStr(),text:txt,stage:state.logStage||cw.status});
      cw.last=Date.now();
      ta.value='';
      renderAssigned(); toast('Note added');
    }
  });
  /* phone tab bar: shrinks to icons after a real scroll down, expands on scroll up; ignores bounce and section changes so it never jumps */
  var lastY=0, acc=0, lastFlip=0, barEl=document.querySelector('.tabs');
  window.addEventListener('scroll',function(){
    var now=Date.now(), y=window.scrollY||0, max=document.documentElement.scrollHeight-window.innerHeight;
    if(now<scrollLock||y<0||y>max){lastY=Math.max(0,Math.min(y,max));acc=0;return;}
    var d=y-lastY; lastY=y;
    if(d*acc<0) acc=0;
    acc+=d;
    var isMin=barEl.classList.contains('min');
    /* never flip again while the last animation is still running, so the icons cannot jitter */
    if(!isMin&&acc>48&&y>140&&now-lastFlip>450){barEl.classList.add('min');lastFlip=now;acc=0;}
    else if(isMin&&((acc<-32&&now-lastFlip>450)||y<60)){barEl.classList.remove('min');lastFlip=now;acc=0;}
  },{passive:true});

  render();
  /* first placement without animation, then enable the glide */
  setTimeout(function(){placePill();document.querySelector('.tabs').classList.add('ready');},150);
})();
</script>
