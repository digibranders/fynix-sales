<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e7ece5">
<title>Set your password · Fynix Sales</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/css/invite.css">
</head>
<body>
<div class="page">
  <div class="card">
    <main class="side">
      <div class="brand"><span class="mark"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h3.5v12H3zM9.5 2H13v7H9.5z"/></svg></span>Fynix Sales</div>

      <div class="panel">
        <p class="sub" id="loading">Checking your link…</p>

        <form id="accept" novalidate hidden>
          <h1 id="h">Create your password</h1>
          <p class="sub" id="sub">Choose a password to finish setting up your account.</p>

          <label class="l" for="email">Email</label>
          <div class="inp"><input id="email" type="email" readonly tabindex="-1" autocomplete="username"></div>

          <label class="l" for="pw">Password</label>
          <div class="inp pw">
            <input id="pw" type="password" placeholder="At least 10 characters" autocomplete="new-password" minlength="10" enterkeyhint="next" required>
            <button type="button" class="eye" data-eye="pw" aria-label="Show password" aria-pressed="false">Show</button>
          </div>

          <label class="l" for="again">Repeat password</label>
          <div class="inp pw">
            <input id="again" type="password" placeholder="Type it once more" autocomplete="new-password" enterkeyhint="go" required>
            <button type="button" class="eye" data-eye="again" aria-label="Show password" aria-pressed="false">Show</button>
          </div>

          <p class="err" id="err" role="alert"></p>
          <button class="btn" type="submit" id="go">Create account</button>
        </form>

        <div id="bad" hidden>
          <h1>This link can't be used</h1>
          <p class="sub" id="bad-msg">It has expired or was already used. Ask your admin for a new invite link.</p>
          <a class="btn go-login" href="/login">Go to sign in</a>
        </div>
      </div>

      <p class="foot">sales.fynix.digital</p>
    </main>

    <section class="art" id="art" aria-label="Sales reminders">
      <p class="q-text swap" id="q-text"></p>
      <div class="ctl">
        <button type="button" class="arrow" id="prev" aria-label="Previous reminder"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button type="button" class="arrow" id="next-q" aria-label="Next reminder"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
        <span class="count" id="count">01 / 06</span>
      </div>

      <div class="scene" aria-hidden="true">
        <svg viewBox="0 0 520 300" preserveAspectRatio="xMidYMax meet">
          <circle cx="70" cy="78" r="40" fill="#e5483b"/>
          <line x1="0" y1="290.5" x2="520" y2="290.5" stroke="rgba(242,239,230,.18)"/>
          <g class="stair" id="stair"></g>
          <g stroke-linecap="round">
            <line x1="485" y1="110" x2="485" y2="54" stroke="#f2efe6" stroke-width="3"/>
            <path d="M486 54h30l-8 11 8 11h-30z" fill="#e5483b"/>
          </g>
          <g class="runner" id="runner" style="transform:translate(65px,250px)">
            <path d="M0 -24V-11M0 -11L-6 0M0 -11L6 0M-7 -19L7 -23" stroke="#f2efe6" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <circle cx="0" cy="-32" r="7" fill="#f2efe6"/>
          </g>
        </svg>
      </div>
    </section>
  </div>
</div>
<script type="module" src="/assets/js/invite.js"></script>
</body>
</html>
