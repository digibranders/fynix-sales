<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fynix Sales Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Admin navigation">
    <div class="brand"><span class="logo"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h3.5v12H3zM9.5 2H13v7H9.5z"/></svg></span><span>Fynix Sales</span></div>
    <div class="sec">Category</div>
    <div class="cats" role="group" aria-label="Category" id="cats"></div>
    <div class="catnote" id="catnote"></div>
    <div class="sec">Manage</div>
    <button class="nv" data-view="overview"></button>
    <button class="nv" data-view="workspaces"></button>
    <button class="nv" data-view="lists"></button>
    <button class="nv" data-view="leads"></button>
    <button class="nv" data-view="team"></button>
    <button class="nv" data-view="reports"></button>
    <div class="sp"></div>
    <div class="me"><span class="av" id="me-av"></span><span><b id="me-name"></b><small>Superadmin</small></span><button class="out" data-signout>Sign out</button></div>
  </aside>
  <main class="main" id="view" data-tone="all"><div class="empty">Loading</div></main>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<link rel="modulepreload" href="/assets/js/admin.js">
<link rel="modulepreload" href="/assets/js/shared/dom.js">
<link rel="modulepreload" href="/assets/js/admin/api.js">
<script type="module" src="/assets/js/admin.js"></script>
</body>
</html>
