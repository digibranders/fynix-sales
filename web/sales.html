<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fynix Sales</title>
<script>try{var p=localStorage.getItem('ld_theme')||'light';var d=p==='dark'||(p==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}</script>
<style>
/* Layout: dark top menu bar (tabs + search + user), white flat content; paginated lead table; modal for details; list + detail on Assigned. */
:root{
  --bg:#ffffff; --hover:#f6f7f9; --sel:#f0f2f5; --line:#e8eaee; --line2:#d6dae1;
  --fg:#111318; --muted:#6a7280; --faint:#9aa1ad; --ink:#111318; --ink-fg:#ffffff; --accent:#3b5bdb;
  --d-new:#a3a9b5; --d-contacted:#3b82f6; --d-interested:#e0a100; --d-meeting:#8b5cf6; --d-negotiation:#ea7a1a; --d-won:#16a34a; --d-lost:#dc2626;
  --star:#e0a100;
  --nav:#0f1b2d; --nav-fg:#ffffff; --nav-muted:#9fb0c6; --nav-hover:#1a2a42; --nav-sel:#25395a;
  --f:'Inter',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:light;
}
/* dark theme: same tokens, new values. The top bar stays navy in both. */
:root[data-theme="dark"]{
  --bg:#10151d; --hover:#171e29; --sel:#1d2633; --line:#252e3b; --line2:#334052;
  --fg:#e9edf4; --muted:#9aa5b8; --faint:#6e7a8e; --ink:#e9edf4; --ink-fg:#10151d; --accent:#8da2f5;
  --d-new:#7d8799;
  color-scheme:dark;
}
*{box-sizing:border-box}
/* slim light scrollbars (dropdown lists, wide tables) */
*{scrollbar-width:thin;scrollbar-color:#c9ced6 transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c9ced6;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#aab1bc;background-clip:content-box}
body{background:var(--bg);color:var(--fg);font:13.5px/1.5 var(--f);margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
a{color:var(--accent);text-decoration:none;overflow-wrap:anywhere}
a:hover{text-decoration:underline}
.ti{display:none}
.tabs .tab-profile{display:none}
.pill{display:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.muted{color:var(--muted)}

/* menu bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--nav)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);color:var(--nav-fg)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:8px;height:56px}
@media (min-width:821px){
  /* three zones: logo + workspace on the left, the menu in the middle, search + account on the right */
  .top .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);max-width:none;padding-left:28px;padding-right:28px;gap:24px}
  .zl{display:flex;align-items:center;gap:10px;min-width:0}
  .zr{display:flex;align-items:center;justify-content:flex-end;gap:14px;min-width:0}
  .zr .gsearch{flex:0 1 240px;margin-left:0}
  .zr .who{margin-left:0}
  .brand{margin-right:4px}
}
@media (min-width:821px) and (max-width:1180px){
  .zr .gsearch{flex-basis:170px}
  .who-btn>span{display:none}
  .top .wrap{gap:16px;padding-left:20px;padding-right:20px}
}
@media (min-width:821px) and (max-width:980px){
  .brand-t{display:none}
  .zr .gsearch{flex-basis:140px}
}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em;font-size:15px;margin-right:18px;color:#fff}
.brand i{width:22px;height:22px;border-radius:6px;background:#3b5bdb;display:block;position:relative}
.brand i::after{content:"";position:absolute;left:6px;top:5px;width:4px;height:12px;background:#fff;border-radius:1px;box-shadow:6px 4px 0 0 #fff}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;padding:0 14px;cursor:pointer;color:var(--nav-muted);height:36px;border-radius:7px;display:flex;align-items:center;gap:8px;font-weight:500}
.tab:hover{color:#fff;background:var(--nav-hover)}
.tab[aria-selected="true"]{color:#fff;background:var(--nav-sel)}
.tab .c{font:500 11px var(--mono);background:rgba(255,255,255,.14);color:#fff;border-radius:5px;padding:1px 6px}
.tab[aria-selected="true"] .c{background:var(--accent)}
.gsearch{margin-left:auto;position:relative;flex:0 1 280px;min-width:0}
.gsearch svg{pointer-events:none;z-index:4;position:absolute;left:14px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--nav-muted)}
.gsearch input{width:100%;height:34px;border:1px solid transparent;background:var(--nav-hover);color:#fff;border-radius:17px;padding:0 14px 0 36px;position:relative;z-index:0}
.gsearch input::placeholder{color:var(--nav-muted)}
.gsearch input:focus{outline:none;background:var(--nav-sel)}
.ws-btn{display:flex;align-items:center;gap:8px;height:34px;padding:0 11px;border:0;border-radius:9px;background:var(--nav-hover);color:#fff;cursor:pointer;font-weight:500}
.ws-btn:hover{background:var(--nav-sel)}
.tile-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:linear-gradient(180deg,var(--t1),var(--t2));
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.38),0 1px 2px rgba(0,0,0,.18)}
.tile-ic svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ws-btn .tile-ic{width:22px;height:22px;border-radius:6px}
.ws-btn .tile-ic svg{width:14px;height:14px}
.opt .tile-ic+.ol{margin-right:auto}
.opt{justify-content:flex-start}
.opt .ck{margin-left:auto}
.ws-btn .chev{stroke:var(--nav-muted);margin:0}
.ws-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.ws-btn b{font-weight:600}
.ws-btn,.who-btn,.tab{white-space:nowrap}

.top .combo{margin-right:6px}
#nt-dd{margin-right:0}
.nt-btn{position:relative;width:24px;height:24px;border:0;border-radius:6px;background:transparent;box-shadow:none;cursor:pointer;display:grid;place-items:center;padding:0;color:#fff;transition:background .2s ease,box-shadow .2s ease}
.nt-btn:hover{background:var(--nav-hover)}
.bell{width:15px;height:15px;fill:#fff;stroke:none;transform-origin:50% 14%;opacity:.85;transition:opacity .2s ease}
.nt-btn:hover .bell{opacity:1}
.nt-btn.has{background:linear-gradient(180deg,#ff6b63,#e5342d);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25),0 1px 2px rgba(0,0,0,.3)}
.nt-btn.has:hover{background:linear-gradient(180deg,#ff6b63,#e5342d);filter:brightness(1.07)}
.nt-btn.has .bell{opacity:1}
.nt-badge{position:absolute;top:-6px;right:-7px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:#fff;color:#d92d27;font-size:9.5px;font-weight:700;line-height:15px;text-align:center;box-sizing:border-box;font-variant-numeric:tabular-nums;box-shadow:0 0 0 1.5px var(--nav)}
@keyframes badge-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@keyframes bell-ring{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(15deg)}92%{transform:rotate(-13deg)}95%{transform:rotate(9deg)}98%{transform:rotate(-4deg)}}
.nt-btn.has .nt-badge{animation:badge-pulse 1.8s ease-in-out infinite}
.nt-btn.has .bell{animation:bell-ring 5s ease-in-out infinite}
.nt-btn[aria-expanded="true"] .nt-badge,.nt-btn[aria-expanded="true"] .bell{animation:none}
@media (prefers-reduced-motion:reduce){.nt-btn.has .nt-badge,.nt-btn.has .bell{animation:none}}
#nt-dd .nt-pop{position:fixed;top:54px;right:16px;left:auto;width:340px;max-width:calc(100vw - 32px);padding:0;overflow:hidden;transform:none}
.nt-h{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.nt-h b{font-weight:600;font-size:14px;color:var(--fg)}
.nt-all{background:none;border:0;padding:0;color:var(--muted);font-size:12.5px;cursor:pointer}
.nt-all:hover{color:var(--fg)}
.nrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 16px;cursor:pointer;color:var(--fg)}
.nt-h+.opts .nrow:first-child{border-top:0}
.nrow:hover{background:var(--hover)}
.nrow .ol{display:flex;flex-direction:column;min-width:0;flex:1}
.nt-t{font-weight:500;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow.unread .nt-t{font-weight:600}
.nrow .sm{color:var(--muted);font-size:12px}
.nrow:not(.unread) .nt-t{color:var(--muted);font-weight:400}
.nrow:not(.unread) .tile-ic{opacity:.5}
.nt-tag{font-size:12px;font-family:var(--mono);color:var(--muted);flex:none}
.nt-od{color:var(--d-lost)}
.nt-td{color:var(--fg)}
.nrow:not(.unread) .nt-tag{color:var(--faint)}
.nt-empty{margin:0;padding:34px 16px 36px;text-align:center;color:var(--muted);font-size:13px}
.nt-empty b{display:block;color:var(--fg);font-weight:600;font-size:14px;margin-bottom:2px}
.who{display:flex;align-items:center;gap:8px;margin-left:10px;padding-left:14px;border-left:1px solid var(--nav-sel)}
.av{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--ink-fg);display:grid;place-items:center;font-size:10.5px;font-weight:600;flex:none}
.who .av{background:var(--accent);color:#fff}

@property --pad{syntax:'<length>';inherits:true;initial-value:5px}
.gsearch{border-radius:17px;overflow:hidden}
.gclose{display:none;position:absolute;right:5px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;border-radius:50%;background:none;cursor:pointer;z-index:5;place-items:center;padding:0}
.gclose svg{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;pointer-events:none}
.gclose:hover svg{stroke:var(--nav-muted)}
.top.kpi .gsearch{display:none}
.top.kpi .who{margin-left:0}
.top.kpi #nt-dd{margin-left:auto}

/* KPIs */
.pf{padding:2px 0 0}
.pf-card{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px}
.pf-card .pav{width:52px;height:52px;font-size:17px}
.pf-who{display:flex;flex-direction:column;min-width:0}
.pf-who b{font-size:16px;font-weight:600;line-height:1.3}
.pf-who .sm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;margin-top:12px}
.pf-stats div{padding:12px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line)}
.pf-stats div:first-child{border-left:0}
.pf-stats b{font-size:20px;font-weight:600}
.pf-stats span{font-size:12px;color:var(--muted)}
.pf-stats b{line-height:1.15}
.pf-stats .pf-of{font-size:12px;color:var(--faint);font-weight:400;line-height:1.3}
.kp-sh{font-size:12px;font-weight:500;color:var(--muted);margin:14px 2px 0}
.pf-cap{margin:8px 2px 14px;font-size:12px;color:var(--faint);text-align:center}
.pf-h{font-size:12px;font-weight:500;color:var(--muted);margin:22px 4px 8px}
.pf-list{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.pf-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer;color:var(--fg);font-size:14px}
.pf-list > .pf-row:first-child,.pf-list > .combo:first-child .pf-row{border-top:0}
.pf-row:active{background:var(--hover)}
.pf-l{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.pf-l .sm{font-size:12px}
.pi{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pf-chev{width:16px;height:16px;stroke:var(--faint)}
.pf-row .tile-ic{width:30px;height:30px;border-radius:8px}
.pf-row .tile-ic svg{width:18px;height:18px;stroke-width:1.9}
.pf-row .ck{width:14px;height:12px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pf-n{background:var(--ink);color:var(--ink-fg);font-size:11px;font-weight:600;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.pf-red{color:var(--d-lost)}
.pf-out{color:var(--d-lost)}
.pf-theme{cursor:default;border-top:0}
.pf-seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;padding:2px;gap:2px}
.pf-seg button{border:0;background:none;padding:6px 10px;border-radius:7px;color:var(--muted);font-size:12.5px;font-weight:500;cursor:pointer}
.pf-seg button[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg)}
.pf-out .pf-chev{display:none}
.pf-stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.pwf.nt-search{height:36px;margin:0 0 6px;padding:0 12px}
.nt-none{padding:14px 2px;color:var(--muted)}
.nt-item{display:grid;grid-template-columns:26px minmax(0,1fr);column-gap:6px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;cursor:pointer;color:var(--fg)}
.nt-item:first-child{border-top:0}
.nt-item:active{background:var(--hover)}
.nt-no{color:var(--faint);padding-top:1px}
.nt-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.nt-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.nt-top b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt-text{color:var(--fg);margin-top:2px;overflow-wrap:anywhere}
.rp-month{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.rep-arrow{width:34px;height:34px;border:1px solid var(--line2);border-radius:9px;background:none;display:grid;place-items:center;cursor:pointer}
.rep-arrow:active{background:var(--hover)}
.rep-arrow[disabled]{opacity:.35;cursor:default}
.rep-arrow svg{width:7px;height:12px;fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rp-month b{font-weight:600;font-size:15px}
.rp-h{font-size:12px;font-weight:500;color:var(--muted);margin:18px 2px 8px}
.rp-row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line)}
.rp-row:first-of-type{border-top:0}
.rp-l{display:flex;flex-direction:column;min-width:0}
.rp-hist{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;cursor:pointer;color:var(--fg)}
.rp-hist.on b{color:var(--accent)}
.rp-hist b{font-weight:500}
.pw-body{padding:4px 20px 8px}
.pw-body .k{display:block;font-size:12px;color:var(--muted);margin:12px 0 0}
.pwf{display:block;width:100%;height:42px;border:1px solid var(--line2);border-radius:9px;padding:0 12px;font:inherit;font-size:16px;margin-top:6px;background:var(--bg);color:var(--fg)}
.pw-err{color:var(--d-lost);min-height:20px;margin:10px 0 0;font-size:13px}
.prof{display:flex;align-items:center;gap:14px;padding:6px 0 18px}
.pav{width:56px;height:56px;border-radius:50%;background:#3b5bdb;color:#fff;display:grid;place-items:center;font-size:18px;font-weight:600;flex:none}
.pblk{border-top:1px solid var(--line);padding:16px 0 4px}
.pblk h3{font-size:12px;font-weight:500;color:var(--muted);margin:0 0 10px}
.prow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer;color:var(--fg)}
.pblk h3+.prow{border-top:0}
.prow.static{cursor:default}
.prow .ol{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.prow .ck{width:12px;height:10px;flex:none;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.prow[aria-pressed="false"] .ck{visibility:hidden}
.prow .av{width:34px;height:34px;font-size:12px}
.kc-black{--k:#111318;--dot:#111318}
:root[data-theme="dark"] .kc-black{--k:#e9edf4;--dot:#e9edf4}
.kc-green{--k:#16a34a;--dot:#16a34a}
.kc-red{--k:#dc2626;--dot:#dc2626}
.kseg{display:inline-flex;margin-left:auto;border:1px solid var(--line2);border-radius:8px;overflow:hidden;align-self:center}
.kseg button{background:none;border:0;border-right:1px solid var(--line2);padding:0 13px;height:30px;cursor:pointer;color:var(--muted);font-size:13px;white-space:nowrap}
.kseg button:last-child{border-right:0}
.kseg button:hover{background:var(--hover);color:var(--fg)}
.kseg button.on{background:var(--ink);color:var(--ink-fg);font-weight:500}
.l-short{display:none}
.kcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:4px}
.kcard{min-width:0}
.kc-l{font-weight:500}
.kc-n{font-size:30px;font-weight:500;line-height:1.1;letter-spacing:-.02em;margin:6px 0 2px}
.kc-n small{font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0}
.ktrack{position:relative;height:6px;border-radius:3px;background:var(--sel);margin:10px 0 6px}
.ktrack i{display:block;height:100%;border-radius:3px;background:var(--k)}
.ktrack b{position:absolute;top:-3px;width:2px;height:12px;background:var(--muted);border-radius:1px}
.kpnote{margin:10px 0 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.katt{display:flex;justify-content:space-between;align-items:center;gap:14px 20px;flex-wrap:wrap;border:1px solid var(--line);padding:14px 16px;background:var(--bg);border-radius:12px;margin:0 0 8px}
.katt-t{font-weight:600;font-size:14px}
.katt-l{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px;color:var(--muted)}
.katt-l li{display:flex;align-items:baseline;gap:10px}
.katt-l .num{min-width:18px;color:var(--fg);font-weight:500}
.katt-l .num.r{color:var(--d-lost)}
.katt.calm{color:var(--muted)}
.katt.hot{--kc:#dc2626;border-color:rgba(220,38,38,.38);background:rgba(220,38,38,.07)}
.katt.warn{--kc:#d98a00;border-color:rgba(217,138,0,.42);background:rgba(217,138,0,.09)}
.katt.hot .katt-t,.katt.warn .katt-t{display:flex;align-items:center;color:var(--kc)}
.katt-i{width:17px;height:17px;stroke:var(--kc);fill:none;stroke-width:2;stroke-linecap:round;flex:none;margin-right:7px}
.katt.hot .katt-l .num,.katt.warn .katt-l .num{color:var(--kc);font-weight:600}
.katt .btn{flex:none}
.klink{background:none;border:0;color:var(--accent);cursor:pointer;font-size:13px;padding:0}
.klink:hover{text-decoration:underline}
.kcols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:0 48px}
.ksec{padding:20px 0;border-bottom:1px solid var(--line)}
.ksec h3{font-size:12px;font-weight:500;color:var(--muted);margin:0 0 14px}
.frow{display:grid;grid-template-columns:120px minmax(0,1fr) 28px;gap:12px;align-items:center;padding:6px 0}
.frow .num:last-child{text-align:right}
.ftrack{height:8px;border-radius:4px;background:var(--sel);overflow:hidden}
.ftrack i{display:block;height:100%;border-radius:4px;background:var(--dot);min-width:0}
.ftrack i::before{content:none}
.act{padding:10px 0;border-top:1px solid var(--line)}
.act:first-of-type{border-top:0;padding-top:0}
main{overflow-x:clip}
@keyframes v-fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes v-fall{from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:none}}
@keyframes v-in-r{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes v-in-l{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.v-tab{animation:none}

  .detail{border-left:0;padding-left:0}

  .msum{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 4px}
  .msum.hide-m{display:none}
  .qhead{display:none}
  .list{border-top:0}
  .qsec{padding:14px 2px 6px}
  .head + .split{margin-top:-6px;border-top:0}
  .qhead + .qsec{padding-top:2px}
  button.qsec{display:flex;align-items:center;justify-content:flex-start;gap:6px;pointer-events:auto;cursor:pointer;color:var(--muted);padding:14px 2px 6px}
  button.qsec .chev{display:block;margin:0;stroke:var(--muted)}
  button.qsec[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .list:not(.closed-open) .closed-item{display:none}
  .item-wrap{border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0;background:none;box-shadow:none}
  .item{grid-template-columns:22px minmax(0,1fr) max-content;grid-template-areas:"no name name" ". sub sub" ". tags fu";column-gap:6px;border-radius:0;padding:12px 0;min-height:0;align-items:start}
  .item:hover,.split.show-detail .item[aria-current="true"]{background:none}
  .item .no{grid-area:no;grid-column:auto;padding-top:1px}
  .item .name{grid-area:name;grid-column:auto;font-size:15px;white-space:normal}
  .m-sub{display:block;grid-area:sub;font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .st{display:none}
  .item .stgt{display:inline-flex;align-items:center;grid-area:tags;margin-top:6px;min-width:0}
  .item .stgt.flat{gap:6px}
  .item .fu{grid-area:fu;margin-top:6px;font-size:12.5px;justify-self:end;white-space:nowrap;line-height:1.5}
  .item .last{display:none}
  .item-wrap.has-act .name,.item-wrap.has-act .m-sub{padding-right:88px;box-sizing:border-box}
  .act2{display:flex;top:10px;right:10px;transform:none}
  .act2 .tile-ic{width:36px;height:36px;border-radius:11px}
  .act2 .tile-ic svg{width:22px;height:22px}
  .a2{border-radius:11px}
  .head-back{display:inline-flex;align-items:center;justify-content:center;align-self:center;width:30px;height:30px;margin:0 -2px 0 -8px;border:0;background:none;border-radius:8px;cursor:pointer}
  .head-back:active{background:var(--sel)}
  .head-back svg{width:9px;height:15px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* lead details: smaller title bar, everything below sits closer to it */
  .head-d{display:none}
  .head-d + .split{margin-top:-6px}
  .head-d + .split .d-head{padding-top:6px}
  .head-d + .split .detail{padding-top:0}
  .d-back{display:inline-grid;place-items:center;width:28px;height:28px;margin:0 0 0 -8px;border:0;background:none;border-radius:8px;cursor:pointer;flex:none}
  .d-back:active{background:var(--sel)}
  .d-back svg{width:8px;height:14px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* lead cards */
  .kv{grid-template-columns:80px 1fr}

  /* popup becomes a bottom sheet */
  .scrim{align-items:end;padding:0}
  .modal{width:100%;border-radius:14px 14px 0 0;max-height:90%}
  /* phones: sheets slide up from the bottom and back down */
  .scrim .modal{animation:sheet-up .44s cubic-bezier(.22,1,.36,1)}
  .scrim.leaving .modal{animation:sheet-down .26s cubic-bezier(.4,0,1,1) forwards}
  @media (prefers-reduced-motion:reduce){.scrim .modal,.scrim.leaving .modal{animation:none}}
  .m-foot{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
}

@media (max-width:820px){input,select,textarea{font-size:16px!important}}

<script>
(function(){
  'use strict';

  var CURRENT_USER_ID = '';
  function api(method, url, body){
    var opts = {method: method, headers: {}, credentials: 'same-origin'};
    if(body !== undefined){ opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    return fetch(url, opts).then(function(res){
      return res.text().then(function(text){
        var data = null; try{ data = text ? JSON.parse(text) : null; }catch(e){ data = null; }
        if(res.status === 401){ window.location.href = '/login'; throw {status: 401, message: 'Please sign in again.'}; }
        if(!res.ok) throw {status: res.status, code: data && data.error, message: (data && data.message) || 'Something went wrong. Please try again.'};
        return data;
      });
    });
  }

  /* Fonts load after first paint so a slow font host can never leave the page blank. */
  try{
    var fl=document.createElement('link');
    fl.rel='stylesheet';
    fl.href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap';
    document.head.appendChild(fl);
  }catch(e){}
  /* If something throws before the page is drawn, say so on screen instead of showing nothing. */
  window.addEventListener('error',function(ev){
    var v=document.getElementById('view');
    if(v&&!v.firstChild){
      var d=document.createElement('div'); d.className='empty';
      var b=document.createElement('b'); b.textContent='The dashboard could not start';
      d.appendChild(b); d.appendChild(document.createTextNode(String(ev.message||'Unknown error')));
      v.appendChild(d);
    }
  });

  function showFatal(message){
    var v = document.getElementById('view');
    if(!v) return;
    v.innerHTML = '';
    var d = document.createElement('div'); d.className = 'empty';
    var b = document.createElement('b'); b.textContent = 'Fynix Sales could not load';
    d.appendChild(b); d.appendChild(document.createTextNode(message));
    v.appendChild(d);
  }

  Promise.all([api('GET', '/api/sales/bootstrap'), fetch('/assets/gbc.json').then(function(r){ return r.json(); })])
    .then(function(r){ boot(r[0], r[1]); })
    .catch(function(e){ if(!e || e.status !== 401) showFatal((e && e.message) || 'Please refresh the page.'); });

  function boot(DATA, GBC){
  CURRENT_USER_ID = DATA.me.id;
  if(!DATA.workspaces.length){
    document.querySelector('.tabs').style.display = 'none';
    document.getElementById('ws-dd').style.display = 'none';
    showFatal('You are not in any service yet. Ask your superadmin to add you to one.');
    return;
  }
  var USERS = [DATA.me];

  /* All Google Business categories (lobstrio/google-business-categories): [name, industry group index, worldwide businesses]. */
  var GROUPS = GBC.groups;
  var CATS = GBC.cats;
  var CAT_GROUP = {}, CAT_CANON = {};
  CATS.forEach(function(c){ CAT_GROUP[c[0]] = c[1]; CAT_CANON[c[0].toLowerCase()] = c[0]; });
  var CAT_ALIAS = {'diamond merchant':'Diamond dealer','gemstone jeweler':'Gemstone dealer','designer clothing store':'Clothing store'};

  function prepLead(r){
    var k = String(r.cat || '').toLowerCase();
    r.cat = CAT_CANON[k] || CAT_ALIAS[k] || r.cat || '';
    r.grp = CAT_GROUP.hasOwnProperty(r.cat) ? CAT_GROUP[r.cat] : -1;
    r.email = r.email || []; r.open = r.open || []; r.work = r.work || {};
    r.company = r.company || '';
    r.title = r.title || '';
    r.personalNumber = r.personalNumber || '';
    r.keywords = r.keywords || '';
    r.linkedin = r.linkedin || '';
    return r;
  }
  var LEADS = DATA.leads.map(prepLead);

  function isScale(){
    var s = svcById(state.service);
    return (s && s.id && s.id.indexOf('scale') === 0) || (DATA.category === 'scale') || (DATA.me && DATA.me.category === 'scale');
  }

  /* Workspaces come from the server. Icon and colour are looked up by name. */
  var ICON_MARK = {
    globe:'<circle cx="12" cy="12" r="8.6"/><path d="M3.4 12h17.2M12 3.4c2.7 2.8 2.7 14.4 0 17.2M12 3.4c-2.7 2.8-2.7 14.4 0 17.2"/>',
    seo:'<circle cx="10.5" cy="10.5" r="6.2" stroke-width="2.2"/><path d="M15.2 15.2L20.2 20.2" stroke-width="2.6"/><path d="M7.7 12.2l2-2.2 1.6 1.2 2-2.6" stroke-width="1.6"/>',
    chat:'<path style="fill:#fff;stroke:none" d="M6 4h12a3 3 0 0 1 3 3v7.5a3 3 0 0 1-3 3h-5.5L8 21v-3.5H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/><path style="fill:var(--tile);stroke:none" d="M12 14s-3.4-2-3.4-4.4a1.9 1.9 0 0 1 3.4-1.2 1.9 1.9 0 0 1 3.4 1.2C15.4 12 12 14 12 14z"/>',
    gem:'<path style="fill:#fff;stroke:none" d="M12 2.8l6.3 8.7-6.3 9.7-6.3-9.7z"/><circle cx="12" cy="10.4" r="1.7" style="fill:var(--tile);stroke:none"/><path d="M12 12v8" style="stroke:var(--tile)" stroke-width="1.6"/>',
    pen:'<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/>',
    star:'<path d="M12 4l2.4 5 5.4.7-4 3.8 1 5.4L12 16.2 7.2 18.9l1-5.4-4-3.8 5.4-.7z"/>'
  };
  var TILE_COLORS = {blue:['#4aa3ff','#0a64e8'], green:['#4be07a','#1aa64a'], pink:['#ff6b8b','#e0244f'], violet:['#a58bff','#6d4aff'], amber:['#ffbd4a','#fb8500'], slate:['#8793a6','#505b6e']};
  function toService(w){
    var c = TILE_COLORS[w.color] || TILE_COLORS.slate;
    return {id:w.id, name:w.name, t1:c[0], t2:c[1], icon:ICON_MARK[w.icon] || ICON_MARK.globe};
  }
  var SERVICES = DATA.workspaces.map(toService);
  function svcIcon(s){return '<span class="tile-ic" style="--t1:'+s.t1+';--t2:'+s.t2+';--tile:'+s.t2+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+s.icon+'</svg></span>';}

  var STAGES=['New','Contacted','Interested','Meeting','Negotiation','Won'];
  function sclass(s){return 'st-'+s.split(' ')[0].toLowerCase();}
  /* The last stage is called Won in the data and Closed on screen. */
  function SL(s){return s==='Won'?'Closed':s;}
  function sysText(t){return String(t).replace(/\bWon\b/g,'Closed');}

  var PAGE=20;
  var state={user:DATA.me.id,service:SERVICES[0].id,tab:'info',q:'',area:'',grp:'',cat:'',need:[],open:'',minr:'',sort:'rev',page:0,selected:null,showDetail:false,stageFilter:'',logStage:'',stgOpen:{},stgLead:'',calMonth:'',qf:'',closedOpen:false,kpiPeriod:'month',read:{},modal:null};
  DATA.reads.forEach(function(k){ state.read[k] = true; });
  function fmtAt(ms){ var d = new Date(ms); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
  function failToast(e){ toast((e && e.message) || 'Something went wrong. Please try again.'); }

  function toTitleCase(s){
    if(!s) return '';
    return String(s).toLowerCase().replace(/(^|[^a-zA-Z0-9'])([a-z])/g, function(m, p1, p2){
      return p1 + p2.toUpperCase();
    });
  }

  function lockScroll(){
    document.documentElement.classList.add('modal-locked');
    document.body.classList.add('modal-locked');
  }
  function unlockScroll(){
    document.documentElement.classList.remove('modal-locked');
    document.body.classList.remove('modal-locked');
  }
  function bindScrim(sc){
    if(!sc) return;
    sc.addEventListener('touchmove',function(e){if(e.target===sc)e.preventDefault();},{passive:false});
  }

  /* The last three stages a lead went through, ending at where it is now, e.g. Contacted -> Interested -> Meeting. */
  function assignedStagePreview(w){
    var seq=[];
    ((w&&w.history)||[]).forEach(function(h){ if(seq[seq.length-1]!==h.s) seq.push(h.s); });
    if(w&&w.status&&seq[seq.length-1]!==w.status) seq.push(w.status);
    if(!w||!w.status||seq.length<2){
      return '<span class="st-preview st-new"><span class="st-lbl">Stage:</span> <span class="st-val">'+esc(SL((w&&w.status)||'New'))+'</span></span>';
    }
    var trail=seq.slice(-3), cur=trail.pop();
    return '<span class="st-preview st-moved">'+trail.map(function(x){
      return '<span class="st-from">'+esc(SL(x))+'</span> <span class="st-arr" aria-hidden="true">&rarr;</span> ';
    }).join('')+'<span class="st-val '+sclass(cur)+'">'+esc(SL(cur))+'</span></span>';
  }

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function user(id){return USERS.filter(function(u){return u.id===id;})[0];}
  function W(l){return l.work[state.service]||null;}
  function svcById(id){return SERVICES.filter(function(s){return s.id===id;})[0];}
  function svcName(){return svcById(state.service).name;}
  function mine(){return LEADS.filter(function(l){var w=W(l);return w&&w.owner===state.user;});}
  function open_(){return LEADS.filter(function(l){return l.open.indexOf(state.service)>-1;});}
  function alsoHtml(l){
    var s=Object.keys(l.work).filter(function(k){return k!==state.service&&l.work[k].owner===state.user;});
    return s.length?'<div class="sm">Also yours in '+s.map(function(k){return esc(svcById(k).name);}).join(', ')+'</div>':'';
  }
  function byId(id){return LEADS.filter(function(l){return l.id===id;})[0];}
  function nowStr(){var d=new Date();return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
  function matchQ(l){
    var q=state.q.trim().toLowerCase();

  function ddItems(id,q){

  /* Phone sheets: a grab handle, a round close button, and drag-to-close from the handle or the header.
     The drag uses the separate `translate` property, so the slide-up and slide-down animations keep working. */
  (function(){
    var mqS=window.matchMedia?window.matchMedia('(max-width:820px)'):null;
    function enhance(modal){
      if(!modal||modal.dataset.sheet) return;
      modal.dataset.sheet='1';
      var grab=document.createElement('div');
      grab.className='m-grab'; grab.setAttribute('aria-hidden','true'); grab.innerHTML='<i></i>';
      modal.insertBefore(grab,modal.firstChild);
      var startY=0, dy=0, t0=0, active=false;
      function down(e){
        if(!mqS||!mqS.matches||e.button>0) return;
        if(e.target.closest('button,a,input,textarea,select')) return;
        if(modal.scrollTop>0&&!e.target.closest('.m-grab')) return;
        active=true; startY=e.clientY; dy=0; t0=Date.now();
        modal.style.transition='none';
        try{e.currentTarget.setPointerCapture(e.pointerId);}catch(err){}
      }
      function move(e){
        if(!active) return;
        dy=Math.max(0,e.clientY-startY);
        modal.style.translate='0 '+dy+'px';
      }
      function up(){
        if(!active) return;
        active=false;
        var fast=dy/(Date.now()-t0+1)>0.6;
        if(dy>110||(fast&&dy>40)){
          modal.style.transition='translate .22s cubic-bezier(.4,0,1,1)';
          modal.style.translate='0 100%';
          setTimeout(function(){modal.style.visibility='hidden';closeModal();},210);
        } else {
          modal.style.transition='translate .3s cubic-bezier(.22,1,.36,1)';
          modal.style.translate='0 0';
          setTimeout(function(){modal.style.transition='';modal.style.translate='';},300);
        }
      }
      [grab,modal.querySelector('.m-head')].forEach(function(el){
        if(!el) return;
        el.addEventListener('pointerdown',down);
        el.addEventListener('pointermove',move);
        el.addEventListener('pointerup',up);
        el.addEventListener('pointercancel',up);
      });
    }
    new MutationObserver(function(){var m=layer.querySelector('.scrim .modal');if(m) enhance(m);}).observe(layer,{childList:true,subtree:true});
  })();

  function periodStart(p){
    var d=new Date(); d.setHours(0,0,0,0);

    for(var i=0;i<h.length;i++){ if(h[i].s!=='New') return h[i].t>=start; }
    return false;
  }
  function monthElapsed(){var d=new Date(), dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()/dim;}

  function renderKpi(){
    var m=mine(), by={};
    STAGES.concat(['Lost']).forEach(function(s){by[s]=0;});
    m.forEach(function(l){by[W(l).status]++;});
    var p=state.kpiPeriod, start=periodStart(p), month=(p==='month');
    var contacted=m.filter(function(l){return leftNewIn(l,start);}).length;
    var won=m.filter(function(l){return enteredIn(l,'Won',start);}).length;
    var openL=m.filter(function(l){var s=W(l).status;return s!=='Won'&&s!=='Lost';});
    var overdue=openL.filter(function(l){return groupOf(l)==='od';}).length;
    var nodate=openL.filter(function(l){return groupOf(l)==='none';}).length;
    var max=Math.max.apply(null,Object.keys(by).map(function(s){return by[s];}).concat([1]));
    var acts=[];
    m.forEach(function(l){
      var mineC=W(l).comments.filter(function(c){return c.by===state.user;});
      if(mineC.length) acts.push({lead:l,c:mineC[mineC.length-1]});
    });
    acts=acts.slice(0,5);
    var seg='<div class="kseg" role="group" aria-label="Period">'+KP_PERIODS.map(function(x){return '<button type="button" data-kp="'+x[0]+'"'+(p===x[0]?' class="on" aria-pressed="true"':' aria-pressed="false"')+'><span class="l-long">'+x[1]+'</span><span class="l-short">'+x[2]+'</span></button>';}).join('')+'</div>';
    var h='<div class="head khead"><h1>KPIs</h1><span class="sub">'+esc(svcName())+'<span class="l-long"> · '+esc(user(state.user).name)+'</span></span>'+seg+'</div>';
    if(!m.length){
      view.innerHTML=h+'<div class="tablewrap"><div class="empty"><b>No leads assigned yet</b>Your numbers appear here once you assign leads in Leads.</div></div>';
      return;
    }
    var att;
    if(overdue||nodate){
      var bits=[];
      if(overdue) bits.push('<li><span class="num r">'+overdue+'</span>'+(overdue===1?'follow-up overdue':'follow-ups overdue')+'</li>');
      if(nodate) bits.push('<li><span class="num">'+nodate+'</span>'+(nodate===1?'lead has no follow-up date':'leads have no follow-up date')+'</li>');
      att='<div class="katt '+(overdue?'hot':'warn')+'"><div><div class="katt-t"><svg class="katt-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.2M12 16.3v.2"/></svg>Needs attention</div><ul class="katt-l">'+bits.join('')+'</ul></div><button type="button" class="btn assign" data-kgo="'+(overdue?'od':'later')+'">View in Assigned</button></div>';
    } else att='<div class="katt calm"><span class="sm">Nothing overdue, and every open lead has a follow-up date.</span></div>';
    h+='<h3 class="kp-sh">'+(month?'Monthly target':(p==='today'?'Today':'Last 7 days'))+'</h3>'+
      statStrip(m.filter(function(l){return assignedIn(l,start);}).length,contacted,won,month,month?'Monthly target':'Counts for the period')+
      (month?'<p class="sm kpnote">This month \u00b7 '+Math.round(monthElapsed()*100)+'% of the month gone</p>':'<p class="sm kpnote">Counts for '+(p==='today'?'today':'the last 7 days')+' \u00b7 targets show on This month</p>')+
      att+
      '<div class="kcols"><section class="ksec"><h3>Pipeline now</h3>'+
        STAGES.concat(['Lost']).map(function(s){
          return '<div class="frow kc-'+kindOf(s)+'"><span class="st">'+SL(s)+'</span><span class="ftrack"><i style="width:'+Math.round(by[s]/max*100)+'%"></i></span><span class="num">'+by[s]+'</span></div>';
        }).join('')+'</section>'+
      '<section class="ksec"><h3>Latest updates</h3>'+(acts.length?acts.map(function(a){
        return '<div class="act"><div class="c-meta"><b>'+esc(a.lead.name)+'</b><span>'+esc(fmtAt(a.c.at))+'</span><span class="st kc-'+kindOf(a.c.stage)+'">'+esc(SL(a.c.stage))+'</span></div><p class="c-body">'+esc(a.c.text)+'</p></div>';
      }).join(''):'<p class="muted">No notes yet. Notes you add on assigned stores show up here.</p>')+'</section></div>';
    view.innerHTML=h;
  }

  /* ---------- wiring ---------- */
  function render(){chrome();({info:renderInfo,assigned:renderAssigned,kpi:renderKpi,profile:renderProfile})[state.tab]();}

  document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){
    if(state.tab===b.dataset.tab){ if(state.tab==='assigned'&&state.showDetail){state.showDetail=false;settleBar();window.scrollTo(0,0);renderAssigned();animateView('pop');} return; }
    state.tab=b.dataset.tab;state.open='';state.showDetail=false;
    settleBar();window.scrollTo(0,0);render();animateView('tab');
  });});

  var gq=document.getElementById('gq');
  var topBar=document.querySelector('.top');
  gq.addEventListener('focus',function(){topBar.classList.add('search-open');});
  gq.addEventListener('blur',function(){setTimeout(function(){if(!gq.value.trim()&&document.activeElement!==gq) topBar.classList.remove('search-open');},120);});
  document.getElementById('gclose').addEventListener('click',function(e){
    e.preventDefault();
    gq.value='';state.q='';state.page=0;gq.blur();topBar.classList.remove('search-open');render();
  });
  gq.addEventListener('input',function(){state.q=gq.value;state.page=0;render();});


  document.addEventListener('click',function(){setTimeout(function(){if(state.open!=='nt') renderNt();},0);});
  document.addEventListener('click',function(e){
    var ne_=e.target.closest('[data-noteedit]'); if(ne_){startEdit(parseInt(ne_.dataset.noteedit,10));return;}
    var ns_=e.target.closest('[data-notesave]'); if(ns_){saveEdit(ns_.closest('.tl2-note'));return;}
    if(e.target.closest('[data-notecancel]')){refreshActivity();return;}
    var ntb=e.target.closest('[data-ntbtn]'); if(ntb){setOpen(state.open==='nt'?'':'nt');return;}
    var nta=e.target.closest('[data-ntall]'); if(nta){markRead(notifications().map(function(n){return n.id;}));renderNt(true);return;}
    var nto=e.target.closest('[data-ntopt]'); if(nto){openNotification(nto.dataset.ntopt);return;}
    var wsb=e.target.closest('[data-wsbtn]');
    if(wsb){setOpen(state.open==='ws'?'':'ws');return;}
    var wso=e.target.closest('[data-wsopt]');
    if(wso){switchService(wso.dataset.wsopt);return;}
    var wb=e.target.closest('[data-whobtn]');
    if(wb){setOpen(state.open==='who'?'':'who');return;}
    var th_=e.target.closest('[data-setheme]'); if(th_){setTheme(th_.dataset.setheme);return;}
    var so_=e.target.closest('[data-signout]');
    if(so_){signOut();return;}
    if(state.open&&!e.target.closest('.combo')) setOpen('');
    var c=e.target.closest('[data-copy]');
    if(c){
      var done=function(){};
      try{navigator.clipboard.writeText(c.dataset.copy).then(done,function(){toast('Copy not available here');});}
      catch(err){toast('Copy not available here');}
    }
  });

  view.addEventListener('click',function(e){
    var nd=e.target.closest('[data-need]');
    if(nd){toggleNeed(nd.dataset.need);refineInfo();return;}
    var ob=e.target.closest('[data-ddopt]');
    if(ob){ddSet(ob.dataset.ddopt,ob.dataset.v);state.open='';renderInfo();return;}
    var db=e.target.closest('[data-ddbtn]');
    if(db){setOpen(state.open===db.dataset.ddbtn?'':db.dataset.ddbtn);return;}
    var a=e.target.closest('[data-assign]'); if(a){openModal(a.dataset.assign);return;}
    var gt=e.target.closest('[data-goto]'); if(gt){state.page=parseInt(gt.dataset.goto,10);renderInfo();window.scrollTo(0,0);return;}
    var pg=e.target.closest('[data-page]'); if(pg){state.page+=parseInt(pg.dataset.page,10);renderInfo();window.scrollTo(0,0);return;}
    var bk=e.target.closest('[data-back]'); if(bk){state.showDetail=false;settleBar();window.scrollTo(0,0);renderAssigned();animateView('pop');return;}
    var p=e.target.closest('[data-pick]'); if(p){state.selected=p.dataset.pick;state.showDetail=true;settleBar();window.scrollTo(0,0);renderAssigned();animateView('push');return;}
    var pf=e.target.closest('[data-pf]');
    if(pf){
      var k=pf.dataset.pf;
      if(k==='password') openPassword();
      else if(k==='signall') openSignAll();
      else if(k==='notes') openNotes();
      else if(k==='report') openReport(null);
      else if(k==='notifications') setOpen(state.open==='nt'?'':'nt');
      else if(k==='today'){state.tab='assigned';state.qf='';state.showDetail=false;state.open='';settleBar();window.scrollTo(0,0);render();animateView('tab');}
      return;
    }
    var inf=e.target.closest('[data-info]'); if(inf){openInfo(inf.dataset.info);return;}
    var fl=e.target.closest('[data-flow]'); if(fl){openFlow(state.selected);return;}
    var kp=e.target.closest('[data-kp]'); if(kp){state.kpiPeriod=kp.dataset.kp;renderKpi();return;}
    var kg=e.target.closest('[data-kgo]'); if(kg){state.tab='assigned';state.qf='';state.showDetail=false;state.open='';settleBar();window.scrollTo(0,0);render();animateView('tab');return;}
    var sfb=e.target.closest('[data-sfbtn]'); if(sfb){setOpen(state.open==='sf'?'':'sf');return;}
    var sfo=e.target.closest('[data-sfopt]'); if(sfo){state.stageFilter=sfo.dataset.sfopt;state.open='';renderAssigned();return;}
    var qf=e.target.closest('[data-qf]'); if(qf){state.qf=state.qf===qf.dataset.qf?'':qf.dataset.qf;renderAssigned();return;}
    var ct=e.target.closest('[data-closedtoggle]'); if(ct){state.closedOpen=!state.closedOpen;renderAssigned();return;}
    var sb=e.target.closest('[data-stagebtn]'); if(sb){setOpen(state.open==='stage'?'':'stage');return;}
    var so=e.target.closest('[data-stageopt]');
    if(so){
      var l=byId(state.selected), w=l&&W(l), ns=so.dataset.stageopt; state.open='';
      if(!w||w.owner!==state.user||w.status===ns){renderAssigned();return;}
      if(isPhone()&&document.querySelector('.stp')&&ns!=='Lost'&&w.status!=='Lost'){
        if(movingStage) return;
        movingStage=true; var prev=w.status; liveStage(w,ns);
        api('PATCH','/api/sales/claims/'+w.id,{status:ns}).then(function(dto){
          l.work[state.service]=dto; state.logStage=ns; state.stgOpen={}; movingStage=false;
          if(ns==='Won'){ setTimeout(function(){ renderAssigned(); chrome(); },Math.max(1,STAGES.indexOf(ns)-STAGES.indexOf(prev))*300+700); return; }
          var ul=document.querySelector('.detail .d-sec .tl2');
          if(ul) ul.outerHTML=activityList(activityItems(dto).slice(0,5));
          chrome();
        }).catch(function(err){ movingStage=false; failToast(err); renderAssigned(); });
        return;
      }
      saveClaim(l, {status:ns}, function(){ state.logStage=ns; state.stgOpen={}; chrome(); });
      return;
    }
    var fb=e.target.closest('[data-fubtn]');
    if(fb){var lo=byId(state.selected), wo=lo&&W(lo); state.calMonth=((wo&&wo.next)||dayOffset(0)).slice(0,7); setOpen(state.open==='fu'?'':'fu'); return;}
    var cn=e.target.closest('[data-calnav]');
    if(cn){
      var cy=parseInt(state.calMonth.slice(0,4),10), cm=parseInt(state.calMonth.slice(5,7),10)-1+parseInt(cn.dataset.calnav,10), dd=new Date(cy,cm,1);
      state.calMonth=dd.getFullYear()+'-'+pad2(dd.getMonth()+1); renderAssigned(); return;
    }
    var cd=e.target.closest('[data-day]');
    if(cd){
      var lc=byId(state.selected), wc=lc&&W(lc); state.open='';
      if(!wc||wc.owner!==state.user){renderAssigned();return;}
      saveClaim(lc, {next:cd.dataset.day}, function(){}); return;
    }
    var fq=e.target.closest('[data-fu]');
    if(fq){
      var lf=byId(state.selected), wf=lf&&W(lf); if(!wf||wf.owner!==state.user) return;
      var nextDay=fq.dataset.fu==='clear'?null:dayOffset(parseInt(fq.dataset.fu,10));
      saveClaim(lf, {next:nextDay}, function(){}); return;
    }
    var tg=e.target.closest('[data-stgtoggle]');
    if(tg){
      var ls=byId(state.selected), ws=ls&&W(ls), sn=tg.dataset.stgtoggle;
      var cur=state.stgOpen.hasOwnProperty(sn)?state.stgOpen[sn]:(ws&&sn===ws.status);
      state.stgOpen[sn]=!cur; renderAssigned(); return;
    }
    var an=e.target.closest('[data-addnote]');
    if(an){state.logStage=an.dataset.addnote;state.stgOpen[an.dataset.addnote]=true;renderAssigned();var nt=document.getElementById('note');if(nt)nt.focus();return;}
    if(e.target.id==='post'){
      var ta=document.getElementById('note'), txt=ta.value.trim();
      if(!txt){ta.focus();toast('Write a note first, or skip it. Notes are optional.');return;}
      var cur=byId(state.selected), cw=W(cur);
      if(!cw||cw.owner!==state.user) return;
      api('POST','/api/sales/claims/'+cw.id+'/notes',{text:txt,stage:state.logStage||cw.status}).then(function(dto){
        cur.work[state.service]=dto; ta.value=''; renderAssigned();
      }).catch(failToast);
      return;
    }
  });
  /* phone tab bar: shrinks to icons after a real scroll down, expands on scroll up; ignores bounce and section changes so it never jumps */
  var lastY=0, acc=0, lastFlip=0, barEl=document.querySelector('.tabs');
  window.addEventListener('scroll',function(){
    var now=Date.now(), y=window.scrollY||0, max=document.documentElement.scrollHeight-window.innerHeight;
    if(now<scrollLock||y<0||y>max){lastY=Math.max(0,Math.min(y,max));acc=0;return;}
    var d=y-lastY; lastY=y;
    if(d*acc<0) acc=0;
    acc+=d;
    var isMin=barEl.classList.contains('min');
    /* never flip again while the last animation is still running, so the icons cannot jitter */
    if(!isMin&&acc>48&&y>140&&now-lastFlip>450){barEl.classList.add('min');lastFlip=now;acc=0;}
    else if(isMin&&((acc<-32&&now-lastFlip>450)||y<60)){barEl.classList.remove('min');lastFlip=now;acc=0;}
  },{passive:true});

  /* Pull fresh data when the tab becomes visible and every couple of minutes. */
  var refreshing=false;
  function refresh(){
    if(refreshing||document.hidden||state.modal||assigning) return;
    var a=document.activeElement;
    if(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')) return;
    refreshing=true;
    api('GET','/api/sales/bootstrap').then(function(d){
      refreshing=false;
      LEADS.length=0; d.leads.forEach(function(r){LEADS.push(prepLead(r));});
      SERVICES.length=0; d.workspaces.forEach(function(w){SERVICES.push(toService(w));});
      NOTICES.length=0; d.notices.forEach(function(n){NOTICES.push(n);});
      d.reads.forEach(function(k){state.read[k]=true;});
      TARGETS.contacted=d.targets.contacted||0; TARGETS.meetings=d.targets.meetings||0; TARGETS.won=d.targets.won||0;
      if(!SERVICES.some(function(s){return s.id===state.service;})&&SERVICES.length) state.service=SERVICES[0].id;
      if(state.selected&&!byId(state.selected)){state.selected=null;state.showDetail=false;}
      render();
    }).catch(function(){refreshing=false;});
  }
  document.addEventListener('visibilitychange',refresh);
  if(MQ_PHONE&&MQ_PHONE.addEventListener) MQ_PHONE.addEventListener('change',function(){ if(state.tab==='assigned') render(); });
  setInterval(refresh,120000);

  render();
  /* first placement without animation, then enable the glide */
  setTimeout(function(){placePill();document.querySelector('.tabs').classList.add('ready');},150);
  }
})();
</script>
</body>
