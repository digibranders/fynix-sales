<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e40af">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<title>Fynix Sales Manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/css/admin.css">
<link rel="stylesheet" href="/assets/css/manager.css">
</head>
<body>
<header class="mtop"><span id="mtitle">Team</span><div class="cats" id="mcats" role="group" aria-label="Category"></div></header>
<div class="app">
  <aside class="side" aria-label="Manager navigation">
    <div class="brand"><span class="logo"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h3.5v12H3zM9.5 2H13v7H9.5z"/></svg></span><span>Fynix Sales</span></div>
    <div class="sec">Category</div>
    <div class="cats" role="group" aria-label="Category" id="cats"></div>
    <div class="catnote" id="catnote"></div>
    <div class="sec">View</div>
    <button class="nv" data-view="team"></button>
    <button class="nv" data-view="leads"></button>
    <div class="sp"></div>
    <div class="me"><span class="av" id="me-av"></span><span><b id="me-name"></b><small>Manager</small></span><button class="out" data-signout>Sign out</button></div>
  </aside>
  <main class="main" id="view" data-tone="all"><div class="empty">Loading</div></main>
</div>
<nav class="bottom" id="bottom" aria-label="Manager navigation"></nav>
<div class="toast" id="toast" role="status" hidden></div>

<link rel="modulepreload" href="/assets/js/manager.js">
<link rel="modulepreload" href="/assets/js/shared/dom.js">
<link rel="modulepreload" href="/assets/js/admin/api.js">
<script type="module" src="/assets/js/manager.js"></script>
</body>
</html>
