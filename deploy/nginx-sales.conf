# Installed as /etc/nginx/sites-available/fynix-sales and linked into sites-enabled. Behind Cloudflare (proxied).
# TLS: a Let's Encrypt certificate named fynix-sales, issued with the webroot /var/www/acme (HTTP-01 through Cloudflare).

server {
    listen 80;
    listen [::]:80;
    server_name sales.fynix.digital;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sales.fynix.digital;

    ssl_certificate     /etc/letsencrypt/live/fynix-sales/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fynix-sales/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:fynixsales_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Visitor address: from CF-Connecting-IP only when the peer is a Cloudflare address.
    include snippets/cloudflare-realip.conf;

    access_log /var/log/nginx/fynix-sales.access.log;
    error_log  /var/log/nginx/fynix-sales.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # CSV imports go up to 25 MB.
    client_max_body_size 30m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwritten with the address nginx saw, never appended to: the app rate-limits on it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:3600;
    }
}
